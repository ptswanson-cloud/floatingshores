<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floating Shores</title>
<style>
:root{--paper:#F5F3EE;--card:#FFFFFF;--line:#DDD8CE;--ink:#1D1B18;--ink-2:#5C574F;--accent:#2F6B6B}
@media (prefers-color-scheme:dark){:root{--paper:#161616;--card:#202020;--line:#343230;--ink:#ECE9E3;--ink-2:#A8A39A;--accent:#7FC4C4}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:40px 16px 60px}
h1{font:600 2rem/1.1 Georgia,"Times New Roman",serif;margin:0 0 6px}
p.sub{margin:0 0 28px;color:var(--ink-2)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px}
a:hover,a:focus-visible{border-color:var(--accent)}
a b{display:block;font-size:1.15rem}
a span{color:var(--ink-2);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Floating Shores</h1>
  <p class="sub">Our apps.</p>
  <ul>
    <li><a href="/instasmath"><b>Instasmath</b><span>Multiplication and division through 12, against the clock</span></a></li>
    <li><a href="/sight-lines"><b>Sight Lines</b><span>Read notes on the treble and bass staves</span></a></li>
    <li><a href="/root-table"><b>The Root Table</b><span>100 Greek and Latin word roots</span></a></li>
  </ul>
</div>
</body>
</html>
